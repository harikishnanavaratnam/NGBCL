# Local development database. Start with:  docker compose up -d
# File uploads use a Cloudflare R2 bucket (free tier) — see backend/README.md › Local uploads.
# Then run the API (backend/) and the web app (frontend/) natively — see README.md.
services:
  db:
    image: postgres:16-alpine
    container_name: ngbcl-db
    environment:
      POSTGRES_DB: ngbcl
      POSTGRES_USER: ngbcl
      POSTGRES_PASSWORD: ngbcl
    ports:
      - "5432:5432"
    volumes:
      - ngbcl-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngbcl -d ngbcl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ngbcl-db:
