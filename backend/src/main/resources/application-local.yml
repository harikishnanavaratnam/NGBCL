# Local development (docker compose up -d). Never use these values elsewhere.
# Optional: put your R2 dev-bucket keys in backend/local-secrets.yml (git-ignored) to enable uploads.
spring:
  config:
    import: optional:file:./local-secrets.yml
ngbcl:
  security:
    jwt-secret: local-dev-only-secret-change-me-0123456789abcdef
    cookie-secure: false
    allowed-origins: http://localhost:3000
    ip-hash-salt: local
  storage:
    # Uploads work out of the box: files go to backend/.dev-storage unless local-secrets.yml sets an R2 endpoint.
    local-disk:
      enabled: true
      signing-key: local-dev-storage-key
  bootstrap:
    admin-email: admin@ngbcl.local
    admin-password: ChangeMe-Local-123
    admin-name: Local Admin

logging:
  level:
    lk.ngbcl: DEBUG
