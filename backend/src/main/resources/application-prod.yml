# Production (deploy/docker-compose.prod.yml sets SPRING_PROFILES_ACTIVE=prod). Secrets come from deploy/.env.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 10000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    lk.ngbcl: INFO
    org.hibernate.SQL: WARN
