spring:
  application:
    name: ngbcl-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ngbcl}
    username: ${DB_USERNAME:ngbcl}
    password: ${DB_PASSWORD:ngbcl}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  # Finish in-flight requests on redeploy instead of cutting them off.
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${NGBCL_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${NGBCL_API_DOCS_ENABLED:true}

ngbcl:
  security:
    # HS256 key — at least 32 bytes. MUST be set via env in every non-local environment.
    jwt-secret: ${NGBCL_JWT_SECRET:}
    jwt-issuer: ngbcl-api
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    cookie-secure: ${NGBCL_COOKIE_SECURE:true}
    # Parent domain so the Next.js proxy can see the session hint cookie, e.g. ".ngbcl.lk". Empty = host-only.
    cookie-domain: ${NGBCL_COOKIE_DOMAIN:}
    allowed-origins: ${NGBCL_ALLOWED_ORIGINS:http://localhost:3000}
    ip-hash-salt: ${NGBCL_IP_HASH_SALT:change-me}
  storage:
    # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com  ·  local MinIO: http://localhost:9000
    endpoint: ${NGBCL_STORAGE_ENDPOINT:}
    region: ${NGBCL_STORAGE_REGION:auto}
    access-key: ${NGBCL_STORAGE_ACCESS_KEY:}
    secret-key: ${NGBCL_STORAGE_SECRET_KEY:}
    private-bucket: ${NGBCL_STORAGE_PRIVATE_BUCKET:ngbcl-private}
    public-bucket: ${NGBCL_STORAGE_PUBLIC_BUCKET:ngbcl-public}
    # URL that serves the public bucket (R2 custom domain / r2.dev URL; MinIO: http://localhost:9000/ngbcl-public)
    public-base-url: ${NGBCL_STORAGE_PUBLIC_BASE_URL:}
    path-style: ${NGBCL_STORAGE_PATH_STYLE:false}
    presign-ttl: 10m
    # Development only — used when no endpoint is set. Off by default; the local profile turns it on.
    local-disk:
      enabled: ${NGBCL_STORAGE_LOCAL_DISK:false}
      directory: ${NGBCL_STORAGE_LOCAL_DIR:./.dev-storage}
      base-url: ${NGBCL_STORAGE_LOCAL_BASE_URL:http://localhost:8080}
      signing-key: ${NGBCL_STORAGE_LOCAL_SIGNING_KEY:}
  registration:
    # Cloudflare Turnstile. Empty secret = check skipped (local/test only — a warning is logged).
    # Cloudflare's always-pass test keys: site 1x00000000000000000000AA, secret 1x0000000000000000000000000000000AA
    turnstile-secret: ${NGBCL_TURNSTILE_SECRET:}
    turnstile-site-key: ${NGBCL_TURNSTILE_SITE_KEY:}
    consent-version: "2026-1"
    session-ttl: 2h
    # Registration sessions one IP may start per hour (abuse limit).
    sessions-per-ip-per-hour: ${NGBCL_REG_SESSIONS_PER_IP:30}
  site:
    # Public website on-demand cache refresh: POST {tags:[...]} after content changes. Empty = off
    # (pages then refresh within a few minutes). Example: https://ngbcl.lk/api/revalidate
    revalidate-url: ${NGBCL_SITE_REVALIDATE_URL:}
    revalidate-secret: ${NGBCL_SITE_REVALIDATE_SECRET:}
  bootstrap:
    # Creates the first Super Administrator on an empty database, then is ignored.
    admin-email: ${NGBCL_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${NGBCL_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${NGBCL_BOOTSTRAP_ADMIN_NAME:Super Admin}
