# Copy to local-secrets.yml (git-ignored) and fill in your Cloudflare R2 dev buckets.
# Without this file the API runs normally; only image uploads answer "storage not configured".
ngbcl:
  storage:
    endpoint: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
    access-key: <R2_ACCESS_KEY_ID>
    secret-key: <R2_SECRET_ACCESS_KEY>
    private-bucket: ngbcl-dev-private
    public-bucket: ngbcl-dev-public
    public-base-url: https://pub-<ID>.r2.dev
    path-style: false
