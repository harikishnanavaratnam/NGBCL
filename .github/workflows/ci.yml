name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit + integration tests (Testcontainers starts PostgreSQL 16 in Docker).
      # Uses the runner's preinstalled Maven: the wrapper's extra download from Maven Central
      # occasionally fails on CI runners. Locally keep using ./mvnw (or mvnw.cmd).
      - run: mvn -B -ntp verify

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck -x -e SC1091 deploy/scripts/*.sh
      - name: Compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.prod.yml config --quiet
      - name: Caddyfile
        run: docker run --rm -e API_DOMAIN=api.example.com -e ACME_EMAIL=ops@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: API image builds
        run: docker build -t ngbcl-api backend

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ngbcl
          POSTGRES_USER: ngbcl
          POSTGRES_PASSWORD: ngbcl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ngbcl" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build API
        working-directory: backend
        run: mvn -B -q -ntp -DskipTests package
      - name: Start API (local profile — bootstrap admin, local-disk storage)
        working-directory: backend
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=local > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
      - name: Build and start web
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: |
          npm ci
          npm run build
          nohup npm start > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 2; done
      - name: Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
            web.log
